<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <meta name="description" content="聊天機器人服務失敗與道歉方式之研究互動情境" />
  <title>機票預訂客服｜互動情境</title>
  <!--
    ===== 第一部分：網頁樣式（CSS） =====
    這一區控制畫面顏色、字體、聊天氣泡、按鈕與手機版排版。
    只修改 CSS 不會改變實驗分組或聊天內容。
  -->
  <style>


    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 11px;
    }

   


    /* 全站共用的字型、文字顏色與配色變數。想換主色可優先調整 --blue。 */
    :root {
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1b2f46;
      background: #eef3f8;
      font-synthesis: none;
      --ink: #1b2f46;
      --muted: #6f8196;
      --line: #e5eaf0;
      --blue: #2367ae;
      --blue-dark: #174e88;
      --white: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      background: radial-gradient(ellipse at 13% 5%, #e1eaf7, transparent 36%),
                  radial-gradient(ellipse at 92% 88%, #e8f3f7, transparent 36%), #eef3f8;
      display: grid;
      place-items: center;
      padding: 26px 16px;
    }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; cursor: pointer; }
    button:focus-visible, a:focus-visible { outline: 3px solid #55a4fd; outline-offset: 4px; }
    button:disabled { cursor: not-allowed; opacity: .6; }
    /* 整個客服視窗的最大寬度、高度、圓角與陰影。 */
    .app {
      width: min(940px, 100%);
      min-height: min(765px, calc(100vh - 52px));
      background: white;
      border: 1px solid #dce5ef;
      border-radius: 23px;
      box-shadow: 0 24px 70px rgba(28, 58, 91, .11), 0 2px 8px rgba(28, 58, 91, .035);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    /* 頂部客服標題列，包含圖示、名稱及「模擬情境」標籤。 */
    .top {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 19px 26px;
      border-bottom: 1px solid var(--line);
      background: white;
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 43px;
      height: 43px;
      background: #e8f1fb;
      color: var(--blue);
      border-radius: 13px;
      flex: 0 0 auto;
    }
    .brand-mark svg { width: 23px; height: 23px; }
    .brand-text { min-width: 0; }
    .brand-text h1 { margin: 0; font-size: 17px; letter-spacing: .015em; font-weight: 750; }
    .brand-text p { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
    .top-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .tag { font-size: 12px; font-weight: 600; color: #54718d; background: #f1f5f9; padding: 7px 10px; border-radius: 50px; white-space: nowrap; }
    .online { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #4d7181; white-space: nowrap; }
    .online-dot { width: 8px; height: 8px; background: #3f9b86; border-radius: 100%; }

    /* 隱藏訂票進度條 */
    .steps {
      display: none !important;
    }

    /* 四階段流程進度條；由 JavaScript 依對話階段更新。 */
    .steps { padding: 15px 26px 16px; background: #fbfdff; border-bottom: 1px solid var(--line); }
    .step-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 11px; }
    .eyebrow { font-size: 11px; letter-spacing: .10em; color: #6c8299; font-weight: 800; }
    .step-caption { font-size: 12px; font-weight: 650; color: #4775a5; }
    .step-track { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
    .step-part { height: 5px; background: #e7edf3; border-radius: 9px; transition: background-color .25s ease; }
    .step-part.on { background: #3984c9; }
    .step-labels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin-top: 8px; }
    .step-labels span { color: #96a4b3; font-size: 11px; text-align: center; }
    .step-labels span.on { color: #315e91; font-weight: 700; }
    /* 開始頁面：研究情境說明與「開始與客服聊天」按鈕。 */
    .intro { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 26px 45px; }
    .intro-inner { text-align: center; width: min(570px, 100%); }
    .intro-mark { width: 70px; height: 70px; margin: auto auto 22px; border-radius: 23px; background: #edf5fe; display: grid; place-items: center; color: #3072b1; }
    .intro-mark svg { width: 32px; height: 32px; }
    .intro h2 { font-size: clamp(21px, 3vw, 28px); line-height: 1.4; letter-spacing: -.02em; margin: 0 0 16px; }
    .intro p { font-size: 15px; color: #5d7186; line-height: 1.95; margin: 0 auto 12px; max-width: 530px; }
    .intro-notice { margin: 22px auto 27px; background: #f6f9fc; border: 1px solid #e6edf3; border-radius: 13px; padding: 12px 18px; color: #62788d; line-height: 1.75; font-size: 13px; text-align: left; }
    .primary { border: 0; color: white; background: var(--blue); border-radius: 12px; min-height: 48px; padding: 12px 28px; font-weight: 750; box-shadow: 0 7px 17px rgba(35,103,174,.16); transition: background-color .15s ease, transform .15s ease; }
    .primary:hover:not(:disabled) { background: var(--blue-dark); transform: translateY(-1px); }
    /* 聊天區：航線說明、對話紀錄和下方回覆選項。 */
    .chat-wrap { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .scenario-strip { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding: 12px 26px; background: #f8fbfe; border-bottom: 1px solid #ebeff4; }
    .scenario-label { display: flex; gap: 8px; align-items: center; font-size: 13px; font-weight: 720; color: #34516f; }
    .scenario-label svg { width: 17px; height: 17px; color: #447dad; }
    .scenario-hint { font-size: 12px; color: #8292a3; }
    .messages {
      flex: 1;
      height: 440px;
      min-height: 300px;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 25px 26px 32px;
      background: linear-gradient(180deg, #fff 0%, #fcfdff 100%);
      scroll-behavior: smooth;
    }
    .conversation-start { text-align: center; margin: 0 0 23px; }
    .conversation-start span { background: #f0f4f8; color: #95a3b2; border-radius: 999px; font-size: 11px; padding: 6px 13px; }
    /* 每則訊息的排列；使用者訊息靠右，Chatbot 訊息靠左。 */
    .message-row { display: flex; align-items: flex-end; gap: 10px; margin: 0 0 18px; animation: fadein .20s ease-out both; }
    .message-row.user { justify-content: flex-end; }
    .avatar { width: 55px; height: 55px; border-radius: 13px; background: #e9f2fa; color: #3978b1; flex: 0 0 auto; display: grid; place-items: center; font-size: 12px; font-weight: 750; }
    .message-group { max-width: min(640px, 80%); display: flex; flex-direction: column; align-items: flex-start; gap: 5px; }
    .message-row.user .message-group { align-items: flex-end; }
    .who { font-size: 11px; font-weight: 700; color: #8294a5; margin: 0 3px; }
    .bubble { padding: 13px 16px; border-radius: 4px 15px 15px 15px; background: #f1f5f9; border: 1px solid #ecf0f4; color: #284058; font-size: 14px; font-weight: 520; line-height: 1.86; white-space: pre-wrap; overflow-wrap: anywhere; }
    .message-row.user .bubble { background: #2673bd; color: #fff; border-color: #2673bd; border-radius: 15px 4px 15px 15px; box-shadow: 0 4px 11px rgba(38,115,189,.13); }
    .typing-bubble { display: flex; align-items: center; gap: 5px; height: 45px; min-width: 72px; }
    .typing-bubble i { width: 6px; height: 6px; border-radius: 50%; background: #8ca6be; display: block; animation: pulse 1s infinite alternate; }
    .typing-bubble i:nth-child(2) { animation-delay: .19s; }
    .typing-bubble i:nth-child(3) { animation-delay: .38s; }
    /* 底部互動區：只顯示當前階段允許的預設回覆，降低受試者間差異。 */
    .interaction { padding: 18px 26px 23px; min-height: 116px; background: white; border-top: 1px solid #e9eef3; }
    .interaction-label { font-size: 12px; color: #8291a2; margin-bottom: 11px; font-weight: 650; }
    .choices { display: flex; flex-wrap: wrap; gap: 9px; }
    .choice { border: 1px solid #bfd7f0; color: #2765a4; background: #f6faff; border-radius: 12px; padding: 12px 16px; min-height: 45px; font-weight: 680; font-size: 13px; line-height: 1.5; text-align: left; transition: background-color .15s, border-color .15s; }
    .choice:hover:not(:disabled) { background: #e9f3ff; border-color: #74afe6; }
    .muted-message { margin: 2px 0 0; font-size: 13px; color: #74889a; line-height: 1.8; }
    /* 完成訂票後顯示的提醒區塊。 */
    .complete { border-radius: 14px; background: #f1f7fc; border: 1px solid #dcebf8; padding: 16px; display: flex; align-items: flex-start; flex-wrap: wrap; justify-content: space-between; gap: 16px; }
    .complete-icon { display: inline-flex; width: 23px; height: 23px; align-items: center; justify-content: center; border-radius: 50%; background: #cee7d9; color: #18754d; font-weight: 800; margin-right: 7px; }
    .complete-title { color: #244969; font-size: 14px; font-weight: 760; }
    .complete-info { font-size: 12px; color: #6b8295; margin-top: 7px; line-height: 1.7; }
    .complete .primary { font-size: 13px; padding: 11px 18px; min-height: 43px; box-shadow: none; }
    /* 研究者測試模式的提示列；正式施測不顯示。 */
    .debug { border-top: 1px dashed #bfd0e0; background: #f6f8fb; padding: 11px 26px; font-size: 12px; color: #5e7284; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    .debug button { padding: 6px 10px; border-radius: 6px; background: #fff; border: 1px solid #c5d2de; color: #3f6383; }
    .hidden { display: none !important; }
    @keyframes fadein { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { from { opacity: .3; transform: translateY(0); } to { opacity: 1; transform: translateY(-2px); } }

    /* 測試模式的組別切換選單 */
    #conditionSelect {
      padding: 7px 10px;
      border: 1px solid #c5d2de;
      border-radius: 6px;
      background: white;
      color: #3f6383;
      font-size: 12px;
      cursor: pointer;
    }

    /* 桌面版與手機版採不同高度、間距；聊天內容與研究條件不變。 */
    @media (min-width: 780px) { .app { height: 790px; max-height: calc(100vh - 52px); } }
    @media (max-width: 620px) {
      body { padding: 0; background: #fff; display: block; }
      .app { width: 100%; height: 100dvh; min-height: 100dvh; border: 0; box-shadow: none; border-radius: 0; }
      .top { padding: 15px 16px; gap: 10px; }
      .brand-mark { width: 39px; height: 39px; }
      .brand-text h1 { font-size: 15px; }
      .top-right .online { display: none; }
      .steps { padding: 13px 16px; }
      .intro { padding: 25px 19px; }
      .intro p { font-size: 14px; }
      .scenario-strip { padding: 12px 17px; }
      .scenario-hint { display: none; }
      .messages { padding: 23px 15px 22px; min-height: 180px; height: auto; }
      .message-group { max-width: 85%; }
      .bubble { font-size: 14px; padding: 12px 14px; }
      .interaction { padding: 13px 16px 21px; min-height: 108px; }
      .choice { width: 100%; }
      .complete { display: block; }
      .complete .primary { margin-top: 13px; width: 100%; }
    }
    /* 尊重使用者的降低動畫設定，避免過多動態效果。 */
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
<main class="app" id="app">
  
  

  <!-- 流程進度區：對話開始前為 0 格，完成後亮起 4 格。 -->
  <section class="steps" aria-label="訂票流程進度">
    <div class="step-head"><span class="eyebrow">預訂流程</span><span class="step-caption" id="progressText">尚未開始</span></div>
    <div class="step-track" id="stepTrack" aria-hidden="true"><div class="step-part"></div><div class="step-part"></div><div class="step-part"></div><div class="step-part"></div></div>
    <div class="step-labels" id="stepLabels" aria-hidden="true"><span>提出需求</span><span>確認日期</span><span>處理訂票</span><span>完成互動</span></div>
  </section>

  <!-- 開始畫面：說明這是模擬訂票，不會產生真實訂單或付款。 -->
  <section class="intro" id="intro">
    <div class="intro-inner">
      <div class="intro-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="15" rx="4"/><path d="m8 21 3-3"/><path d="M7 8h10M7 12h7"/></svg></div>
    
      <p style="font-size: 20px; font-weight: bold;">
        您正在透過AI客服聊天機器人預訂機票，請依照對話內容回覆並完成這次訂票流程。
      </p>
      
      <button class="primary" id="startBtn" type="button">開始與客服聊天</button>
    </div>
  </section>

  <!--
    互動聊天主畫面：
    messageList 存放過往對話；typing 顯示 Chatbot 正在輸入；
    interaction 放置下一步按鈕或完成提示。
  -->
  <section class="chat-wrap hidden" id="chatWrap" aria-label="機票預訂對話">
  
    <div class="messages" id="messages" role="log" aria-label="客服聊天紀錄" aria-live="polite" aria-relevant="additions">
      <div class="conversation-start"><span>對話開始</span></div>
      <div id="messageList"></div>
      <div id="typing" class="message-row bot hidden" aria-label="客服正在輸入">
        <span class="avatar" aria-hidden="true">
          <img src="./robot.png" alt="">
        </span>
        <div class="message-group"><span class="who">AI客服</span><span class="bubble typing-bubble" aria-hidden="true"><i></i><i></i><i></i></span></div>
      </div>
    </div>
    <div class="interaction" id="interaction" aria-live="polite"></div>
  </section>
  <!-- 僅在網址包含 preview=1 時顯示，請不要在正式問卷連結加此參數。 -->
  <div class="debug hidden" id="debugBar">

    <strong>研究者測試模式</strong>

    <span id="debugText"></span>

    <!-- 直接切換實驗組別 -->
    <select id="conditionSelect">
      <option value="neutral">A 組：一般道歉</option>
      <option value="guilt">B 組：內疚式道歉</option>
    </select>

    <button type="button" id="resetBtn">
      清除本次測試進度
    </button>

  </div>
</main>
<script>
(() => {
  /*
    ===== 第二部分：實驗邏輯（JavaScript） =====
    研究目標：比較「一般道歉 neutral」與「內疚式道歉 guilt」。
    核心控制原則：受試者看到的流程、錯誤、重試與成功回覆相同；
    唯一研究操弄是下方 APOLOGY 中的道歉內容。

    本網站是腳本式互動：受試者按預設選項，沒有呼叫真實 AI 或訂票 API。
    正式問卷及資料保存應由 LimeSurvey / 研究伺服器負責。
  */
  'use strict';

  // 【1. 實驗操弄文字】兩組只改這裡；請勿讓其他對話文字跟著變動。
  // 唯一操弄：內疚組多出一個表達內疚的句子。其他對話、流程及呈現一致。
  const APOLOGY = Object.freeze({
    neutral: '很抱歉，我在處理您的訂票時發生錯誤。 請再試一次。',
    guilt: '很抱歉，我在處理您的訂票時發生錯誤。這完全是我的疏失，造成您的不便我感到十分自責😔 下次我會更加謹慎。 請再試一次。'
  });
  // 【2. 全組共用對話】包含：問候 → 訂票需求 → 日期 → 道歉 → 重試 → 成功。
  // 已移除「收到，正在為您處理……」及「好的，我會重新處理……」兩則 Bot 回應。
  // 修改 TEXT 的任一句話都會同時影響一般組與內疚組。
  const TEXT = Object.freeze({
    hello: '您好，我是您的AI智慧客服。請問需要什麼協助？',
    route: '我想預訂從台北飛往峇里島的機票。',
    askDate: '請問您預計哪一天出發？',
    date: '2027 年 8 月 1 日。',
    retry: '再試一次。',
    success: '已成功為您完成2027 年 8 月 1 日台北飛往峇里島的機票預訂。'
  });
  // 【3. 從網址取得實驗設定】例如：?condition=guilt&rid=001&preview=1
  // condition: neutral（A 組）或 guilt（B 組）。亦支援 a/b 等別名。
  // rid: LimeSurvey 傳入的匿名受試者編號，供同一人恢復對話進度。
  // preview=1: 研究者測試模式，會在畫面下方顯示組別及重置按鈕。
  // parent_origin / return: 與問卷頁面銜接，詳見後面的函式。
  const params = new URLSearchParams(location.search);
  const requestedRaw = (params.get('condition') || '').trim().toLowerCase();
  const requested = ({ neutral: 'neutral', a: 'neutral', normal: 'neutral', general: 'neutral', guilt: 'guilt', b: 'guilt', guilty: 'guilt' })[requestedRaw] || null;
  const preview = params.get('preview') === '1';
  const externalRid = (params.get('rid') || '').trim().slice(0, 100);
  // 有 rid 時以匿名編號隔離紀錄；沒有 rid 時使用本機預覽用的 key。
  const subjectKey = externalRid || ('local-preview-' + (requested || 'random'));
  // sessionStorage 只記錄在目前分頁工作階段，並非正式資料庫。
  // 更新測試儲存版本，避免舊版聊天紀錄保留已刪除的兩則訊息。
  const storageKey = 'chatbot-apology-experiment-v2:' + subjectKey;
  // 顯示「正在輸入」的延遲時間（毫秒）：兩組相同，避免時間成為混淆變數。
  const delayMs = 2000; // 兩組處理時間相同，可依研究需要一起調整。

  // 【4. 取得頁面元件】$ 是 document.getElementById 的簡寫。
  const $ = id => document.getElementById(id);
  const app = $('app');
  const intro = $('intro');
  const chatWrap = $('chatWrap');
  const messagesEl = $('messages');
  const messageList = $('messageList');
  const typingEl = $('typing');
  const actions = $('interaction');
  const debugBar = $('debugBar');

  // 【5. 儲存與讀取互動狀態】重新整理後盡量保留進度及實驗組別。
  // 無痕模式可能禁止 sessionStorage，因此利用 try/catch 避免網頁報錯。
  function storageGet(key) {
    try { const s = sessionStorage.getItem(key); return s ? JSON.parse(s) : null; }
    catch (_) { return null; }
  }
  function storageSet(key, value) {
    try { sessionStorage.setItem(key, JSON.stringify(value)); } catch (_) { /* 無痕模式可能禁用 */ }
  }
  // 【6. 隨機分組】若網址沒有 condition，就在 A/B 之間隨機選一組。
  // 優先使用瀏覽器 crypto 產生亂數，無法使用時退回 Math.random。
  // 正式研究更建議由 LimeSurvey 隨機分配，再用 condition 固定組別。
  function chooseRandomCondition() {
    try {
      if (globalThis.crypto && crypto.getRandomValues) {
        const bytes = new Uint32Array(1); crypto.getRandomValues(bytes);
        return (bytes[0] % 2) === 0 ? 'neutral' : 'guilt';
      }
    } catch (_) { /* file:// 下部分瀏覽器不提供 crypto */ }
    return Math.random() < .5 ? 'neutral' : 'guilt';
  }
  // 【7. 還原或建立此次實驗】
  // stage 表示目前對話階段；messages 是已出現的聊天紀錄。
  // startedAt / completedAt 記錄開始與結束時間，用於計算互動秒數。
  let saved = storageGet(storageKey);
  // LimeSurvey 傳入的分組參數優先；同一 rid 刷新時保留已完成的聊天紀錄。
  if (saved && requested && saved.condition !== requested) saved = null;
  let state = saved && [
  'intro',
  'pending_hello',
  'route',
  'pending_askDate',
  'date',
  'pending_failure',
  'retry',
  'pending_success',
  'complete'
  ].includes(saved.stage)
    ? saved
    : { condition: requested || chooseRandomCondition(), stage: 'intro', messages: [], startedAt: null, completedAt: null, completionSent: false };
  // 若未指定條件，恢復時以已記錄的條件為準。
  state.condition = requested || state.condition;
  if (!Array.isArray(state.messages)) state.messages = [];
  if (!(state.condition in APOLOGY)) state.condition = chooseRandomCondition();
  storageSet(storageKey, state);

  // 【8. 共用工具：存檔、計算進度、渲染進度條】
  function save() { storageSet(storageKey, state); }
  function progressNumber() {
    switch (state.stage) {
      case 'intro': return 0;
      case 'route': return 1;
      case 'date': return 2;
      case 'pending_failure':
      case 'retry':
      case 'pending_success': return 3;
      case 'complete': return 4;
      default: return 0;
    }
  }
  function renderProgress() {
    const count = progressNumber();
    document.querySelectorAll('.step-part').forEach((el, idx) => el.classList.toggle('on', idx < count));
    document.querySelectorAll('#stepLabels span').forEach((el, idx) => el.classList.toggle('on', idx < count));
    $('progressText').textContent = count === 0 ? '尚未開始' : count === 4 ? '流程已完成' : '進行中';
  }
  // 【9. 建立單一聊天氣泡】依 role 判斷使用者或 Chatbot。
  // 使用 textContent，而不是 innerHTML：對話文字不會被當成 HTML 執行。
  function makeMessage(message) {
    const row = document.createElement('div');
    row.className = 'message-row ' + (message.role === 'user' ? 'user' : 'bot');
    if (message.role !== 'user') {
      const avatar = document.createElement('span');
      avatar.className = 'avatar'; const img = document.createElement('img');img.src = './robot.png';img.alt = '';avatar.appendChild(img); avatar.setAttribute('aria-hidden','true');
      row.appendChild(avatar);
    }
    const group = document.createElement('div'); group.className = 'message-group';
    const who = document.createElement('span'); who.className = 'who'; who.textContent = message.role === 'user' ? '您' : 'AI客服';
    const bubble = document.createElement('div'); bubble.className = 'bubble'; bubble.textContent = message.text;
    group.append(who, bubble); row.appendChild(group);
    return row;
  }
  // 【10. 訊息顯示控制】新訊息出現後將聊天視窗捲到最底部。
  function scrollBottom() { requestAnimationFrame(() => { messagesEl.scrollTop = messagesEl.scrollHeight; }); }
  // 新訊息同時寫入資料狀態與畫面，以便重新整理後恢復。
  function addMessage(role, text) {
    const message = { role, text };
    state.messages.push(message);
    messageList.appendChild(makeMessage(message));
    save(); scrollBottom();
  }
  // 三個動態小圓點模擬客服正在回覆，兩組呈現相同。
  function showTyping(visible) { typingEl.classList.toggle('hidden', !visible); if (visible) scrollBottom(); }
  function clearActions() { actions.replaceChildren(); }
  function addHint(text) {
    const p = document.createElement('p'); p.className = 'muted-message'; p.textContent = text; actions.appendChild(p);
  }
  // 建立預設回覆按鈕，限制使用者只走研究設計好的聊天路線。
  // { once: true } 避免同一按鈕的事件被重複觸發。
  function addChoice(label, onClick) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'choice'; b.textContent = label;
    b.addEventListener('click', onClick, { once: true });
    const wrap = document.createElement('div'); wrap.className = 'choices'; wrap.appendChild(b); actions.appendChild(wrap);
    return b;
  }
  // 【11. 依目前 stage 顯示下一步】
  // route：選擇航線；date：選擇日期；retry：要求重試。
  // pending_*：等待客服回覆；complete：顯示問卷銜接資訊。
  function renderActions() {
    clearActions();
    if (state.stage === 'route') {
      addHint('請選擇您的回覆：'); addChoice(TEXT.route, chooseRoute);
    } else if (state.stage === 'date') {
      addHint('請選擇您的回覆：'); addChoice(TEXT.date, chooseDate);
    } else if (state.stage === 'retry') {
      addHint('請選擇您的回覆：'); addChoice(TEXT.retry, chooseRetry);
    } else if (  state.stage === 'pending_hello' ||
      state.stage === 'pending_askDate' ||
      state.stage === 'pending_failure' ||
      state.stage === 'pending_success') 
      {
      addHint('客服正在處理您的訂票需求，請稍候……');
    } else if (state.stage === 'complete') {
      showCompletion();
    }
    renderProgress();
    if (preview) {
      $('debugText').textContent = '組別：' + (state.condition === 'guilt' ? 'B 內疚式道歉' : 'A 一般道歉') + '｜階段：' + state.stage + (externalRid ? '｜測試編號：' + externalRid : '');
    }
  }
  // 【12. 實際對話流程：第一步】使用者提出航線需求，Bot 詢問日期。


  // 開場白：動畫結束後才顯示
  function deliverHello() {
    if (state.stage !== 'pending_hello') return;

    showTyping(false);
    state.stage = 'route';

    addMessage('bot', TEXT.hello);
    renderActions();
  }

  // 詢問日期：動畫結束後才顯示
  function deliverAskDate() {
    if (state.stage !== 'pending_askDate') return;

    showTyping(false);
    state.stage = 'date';

    addMessage('bot', TEXT.askDate);
    renderActions();
  }


  function chooseRoute() {
    if (state.stage !== 'route') return;

    // 使用者送出訂票需求
    state.stage = 'pending_askDate';
    addMessage('user', TEXT.route);

    // 先顯示輸入動畫
    renderActions();
    showTyping(true);

    // 1.1 秒後才詢問日期
    setTimeout(deliverAskDate, delayMs);
  }
  // 【13. 第二步】使用者告知日期，Bot 嘗試訂票並進入等待狀態。
  function chooseDate() {
    if (state.stage !== 'date') return;
    state.stage = 'pending_failure';
    // 僅顯示使用者的日期回覆；不再顯示「收到，正在為您處理……」。
    addMessage('user', TEXT.date); renderActions();
    showTyping(true); setTimeout(deliverFailure, delayMs);
  }
  // 【14. 關鍵實驗操弄】首次訂票必然失敗，且原因歸於 Chatbot 自身。
  // 依 state.condition 取用 APOLOGY.neutral 或 APOLOGY.guilt；兩組其餘不變。
  function deliverFailure() {
    if (state.stage !== 'pending_failure') return;
    showTyping(false);
    state.stage = 'retry';
    addMessage('bot', APOLOGY[state.condition]); renderActions();
  }
  // 【15. 第三步】使用者點選「再試一次」，Bot 開始相同的補救程序。
  function chooseRetry() {
    if (state.stage !== 'retry') return;
    state.stage = 'pending_success';
    // 僅顯示使用者的重試指令；不再顯示「好的，我會重新處理……」。
    addMessage('user', TEXT.retry); renderActions();
    showTyping(true); setTimeout(deliverSuccess, delayMs);
  }
  // 【16. 第四步】第二次處理固定成功，兩組都顯示同樣的成功訊息。
  // 此時才將 stage 設成 complete，避免受試者未走完流程就看到完成頁。
  function deliverSuccess() {
    if (state.stage !== 'pending_success') return;
    showTyping(false);
    state.stage = 'complete'; state.completedAt = Date.now();
    addMessage('bot', TEXT.success); renderActions(); sendCompletionMessage();
  }
  // 【17. 開始實驗】點開始按鈕後才紀錄時間並顯示 Bot 問候。
  function start() {
    if (state.stage !== 'intro') return;

    // 先進入等待開場白的階段
    state.stage = 'pending_hello';
    state.startedAt = Date.now();

    save();
    render();
  }
  // 【18. 計算互動時長】數值可回傳 LimeSurvey，但非防作弊的可靠證據。
  function elapsedSec() {
    if (!state.startedAt) return 0;
    return Math.max(0, Math.round(((state.completedAt || Date.now()) - state.startedAt) / 1000));
  }
  // 【19. iframe 嵌入串接】互動完成後，向指定來源的父頁面送出完成訊號。
  // 問卷端必須另外撰寫 postMessage 接收程式，並驗證 event.origin。
  // 只允許指定 http(s) 的 parent_origin；不會把訊息廣播到任意網域。
  function sendCompletionMessage() {
    if (state.stage !== 'complete' || state.completionSent) return;
    state.completionSent = true; save();
    const parentOrigin = params.get('parent_origin');
    // 僅在研究者明確指定受信任的 LimeSurvey 網域時，向嵌入頁面傳遞完成訊號。
    if (window.parent !== window && parentOrigin) {
      try {
        const url = new URL(parentOrigin);
        if (url.protocol === 'https:' || url.protocol === 'http:') {
          window.parent.postMessage({
            type: 'CHATBOT_APOLOGY_COMPLETE',
            version: 1,
            completed: true,
            condition: state.condition,
            rid: externalRid,
            duration_seconds: elapsedSec()
          }, url.origin);
        }
      } catch (_) { /* invalid origin, do not send */ }
    }
  }
  // 【20. 完成後跳轉】從網址的 return 參數讀取正式問卷網址。
  // 轉址時附上 exp_completed、exp_condition、exp_rid、exp_duration_s。
  // 注意：網址參數可由使用者自行修改，不能當作防止造假或完成驗證的唯一依據。
  // 正式資料應用問卷平台的受試者 ID 與伺服器紀錄進行核對。
  function getReturnUrl() {
    const raw = params.get('return');
    if (!raw) return null;
    try {
      const url = new URL(raw);
      if (url.protocol !== 'https:' && url.protocol !== 'http:') return null;
      url.searchParams.set('exp_completed', '1');
      url.searchParams.set('exp_condition', state.condition);
      if (externalRid) url.searchParams.set('exp_rid', externalRid);
      url.searchParams.set('exp_duration_s', String(elapsedSec()));
      return url.href;
    } catch (_) { return null; }
  }
  // 【21. 完成提示】有 return 參數時顯示「返回問卷」按鈕。
  // 沒有 return 參數時只提示返回原問卷，不會自己提交資料。
  function showCompletion() {
    const box = document.createElement('div'); box.className = 'complete';
    const left = document.createElement('div');
    const title = document.createElement('div'); title.className = 'complete-title';
    const check = document.createElement('span'); check.className = 'complete-icon'; check.textContent = '✓'; check.setAttribute('aria-hidden','true');
    title.append(check, document.createTextNode('互動體驗已完成'));
    const info = document.createElement('div'); info.className = 'complete-info'; info.textContent = '您已完成模擬訂票。請依據剛才的感受繼續填寫正式研究問卷。';
    left.append(title, info); box.appendChild(left);
    const returnUrl = getReturnUrl();
    if (returnUrl) {
      const button = document.createElement('button'); button.type = 'button'; button.className = 'primary'; button.textContent = '返回問卷，繼續填答';
      button.addEventListener('click', () => { window.location.assign(returnUrl); }); box.appendChild(button);
    } else {
      const note = document.createElement('div'); note.className = 'complete-info';
      note.textContent = '若由研究問卷進入本頁，請返回原本的問卷頁面繼續填答。'; box.appendChild(note);
    }
    actions.appendChild(box);
  }
  // 【22. 重新繪製整個畫面】切換開始頁與聊天區，恢復歷史訊息。
  // 若剛好在等待回覆時重新整理，會繼續完成對應的等待步驟。
  function render() {
    const active = state.stage !== 'intro';
    intro.classList.toggle('hidden', active);
    chatWrap.classList.toggle('hidden', !active);
    messageList.replaceChildren();
    if (active) state.messages.forEach(message => messageList.appendChild(makeMessage(message)));
    renderActions();
    scrollBottom();
    if (preview) {
      debugBar.classList.remove('hidden');
      $('debugText').textContent = '組別：' + (state.condition === 'guilt' ? 'B 內疚式道歉' : 'A 一般道歉') + '｜階段：' + state.stage + (externalRid ? '｜測試編號：' + externalRid : '');
    }
    // 使用者重新整理時可恢復等待中的流程，不必重跑前面互動。
    
    if (state.stage === 'pending_hello') {
      showTyping(true);
      setTimeout(deliverHello, delayMs);

    } else if (state.stage === 'pending_askDate') {
      showTyping(true);
      setTimeout(deliverAskDate, delayMs);

    } else if (state.stage === 'pending_failure') {
      showTyping(true);
      setTimeout(deliverFailure, delayMs);

    } else if (state.stage === 'pending_success') {
      showTyping(true);
      setTimeout(deliverSuccess, delayMs);
    }

  }
  // 【23. 初始化事件】開始按鈕綁定 start；測試模式可重置進度。
  // 重置只刪除目前 sessionStorage 的測試紀錄，不會刪除正式問卷資料。
  $('startBtn').addEventListener('click', start);
  $('resetBtn').addEventListener('click', () => {
    if (!preview) return;
    try { sessionStorage.removeItem(storageKey); } catch (_) { /* noop */ }
    window.location.reload();
  });
  // 【24. 網頁載入完畢】依目前狀態顯示開始頁或恢復中途對話。

  /* 研究者測試模式：切換 A、B 組 */

  const conditionSelect = $('conditionSelect');

  // 顯示目前的實驗組別
  conditionSelect.value = state.condition;

  // 當研究者切換選項
  conditionSelect.addEventListener('change', () => {

    // 只有測試模式能切換
    if (!preview) return;

    const selectedCondition = conditionSelect.value;

    // 保留原本網址參數，例如 rid
    const url = new URL(window.location.href);

    // 修改網址中的實驗組別
    url.searchParams.set('condition', selectedCondition);
    url.searchParams.set('preview', '1');

    // 清除切換後組別的舊測試進度
    const nextKey = 'chatbot-apology-experiment-v2:' +
      (externalRid || ('local-preview-' + selectedCondition));

    try {
      sessionStorage.removeItem(nextKey);
    } catch (_) {}

    // 重新載入，開始新的實驗
    window.location.assign(url.href);

  });

  render();
})();
</script>
</body>
</html>
